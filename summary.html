  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header & Navigation */
    header {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1.25rem 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-badge {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #38bdf8;
    }

    /* Filters */
    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-input, .genre-select {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus, .genre-select:focus {
      border-color: #38bdf8;
    }

    /* Main Display */
    main {
      flex: 1;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    /* Card Styling */
    .card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      padding: 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0) 100%);
    }

    .card-title {
      font-size: 1.2rem;
      color: #f1f5f9;
      margin-bottom: 0.4rem;
    }

    .card-meta {
      display: flex;
      gap: 10px;
      font-size: 0.8rem;
      color: #94a3b8;
      align-items: center;
    }

    .badge {
      background: #0284c7;
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .card-body {
      padding: 1.25rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .summary-section {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #38bdf8;
      margin-bottom: 0.25rem;
      font-weight: 700;
    }

    .card-footer {
      padding: 0.8rem 1.25rem;
      background: rgba(15, 23, 42, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
      color: #64748b;
    }

    .empty-state {
      text-align: center;
      grid-column: 1 / -1;
      padding: 4rem;
      color: #64748b;
      font-size: 1.1rem;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 1.5rem;
      background: #090d16;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>

      { id: 145, title: "Coraline", year: 2009, director: "Henry Selick", genre: "Animation", rating: "7.7", summary: "A girl discovers a secret door in her home leading to an alternate world that hides dark secrets behind a facade.", keyTheme: "Appreciating real life, bravery." }
    ];

    // DOM References
    const movieGrid = document.getElementById('movieGrid');
    const searchInput = document.getElementById('searchInput');
    const genreSelect = document.getElementById('genreSelect');
    const countDisplay = document.getElementById('countDisplay');

    // Rendering Function
    function renderMovies(list) {
      countDisplay.textContent = `${list.length} Movies`;

      if (list.length === 0) {
        movieGrid.innerHTML = `<div class="empty-state">No Hollywood films matched your search criteria.</div>`;
        return;
      }

      movieGrid.innerHTML = list.map(m => `
        <article class="card">
          <div class="card-header">
            <h2 class="card-title">${m.title}</h2>
            <div class="card-meta">
              <span class="badge">${m.genre}</span>
              <span>${m.year}</span>
              <span>★ ${m.rating}</span>
            </div>
          </div>
          <div class="card-body">
            <div>
              <div class="section-title">Plot Summary</div>
              <div class="summary-section">${m.summary}</div>
            </div>
            <div>
              <div class="section-title">Core Theme</div>
              <div class="summary-section">${m.keyTheme}</div>
            </div>
          </div>
          <div class="card-footer">
            Director: <strong>${m.director}</strong>
          </div>
        </article>
      `).join('');
    }

    // Filter Logic
    function applyFilters() {
      const query = searchInput.value.toLowerCase().trim();
      const selectedGenre = genreSelect.value;

      const filtered = movies.filter(m => {
        const matchesQuery = m.title.toLowerCase().includes(query) ||
                             m.director.toLowerCase().includes(query) ||
                             m.summary.toLowerCase().includes(query) ||
                             m.keyTheme.toLowerCase().includes(query);

        const matchesGenre = selectedGenre === 'ALL' || m.genre === selectedGenre;

        return matchesQuery && matchesGenre;
      });

      renderMovies(filtered);
    }

    // Event Listeners
    searchInput.addEventListener('input', applyFilters);
    genreSelect.addEventListener('change', applyFilters);

    // Initial Launch
    renderMovies(movies);
  </script>
